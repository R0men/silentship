# /etc/nginx/sites-available/silentship  (symlink into sites-enabled)
# TLS certificates: `sudo certbot --nginx -d silentship.dev -d www.silentship.dev` fills in the ssl_* lines.

server {
    listen 80;
    listen [::]:80;
    server_name silentship.dev www.silentship.dev;
    return 301 https://silentship.dev$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.silentship.dev;
    # ssl_certificate / ssl_certificate_key: added by certbot
    return 301 https://silentship.dev$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name silentship.dev;
    # ssl_certificate / ssl_certificate_key: added by certbot

    client_max_body_size 16k;

    # Common proxy settings. X-Forwarded-For is OVERWRITTEN with the real client address: the API
    # rate-limits sign-ups per IP and must not see anything a client wrote into that header.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Live updates (Server-Sent Events): never buffer, keep the stream open.
    # The API sends a comment every 25 s, so a 1 h read timeout only ends truly dead streams.
    location = /api/live {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
